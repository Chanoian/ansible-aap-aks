---
- name: Prove EE pod is running in Azure (AKS)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Get Azure instance metadata
      ansible.builtin.uri:
        url: http://169.254.169.254/metadata/instance?api-version=2021-02-01
        headers:
          Metadata: "true"
        return_content: true
      register: azure_metadata

    - name: Show cloud provider and location
      ansible.builtin.debug:
        msg:
          - "Cloud: Azure"
          - "Region: {{ azure_metadata.json.compute.location }}"
          - "VM Size: {{ azure_metadata.json.compute.vmSize }}"
          - "Resource Group: {{ azure_metadata.json.compute.resourceGroupName }}"
          - "Hostname: {{ azure_metadata.json.compute.name }}"
