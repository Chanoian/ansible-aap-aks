---
- name: Create Azure resource group from AKS Container Group
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resource_group_name: aap-managed-rg
    location: eastus
    azure_api: https://management.azure.com

  tasks:
    - name: Get Azure access token
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ lookup('env', 'AZURE_TENANT') }}/oauth2/v2.0/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ lookup('env', 'AZURE_CLIENT_ID') }}"
          client_secret: "{{ lookup('env', 'AZURE_SECRET') }}"
          scope: https://management.azure.com/.default
      register: auth

    - name: Create resource group
      ansible.builtin.uri:
        url: "{{ azure_api }}/subscriptions/{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}/resourcegroups/{{ resource_group_name }}?api-version=2021-04-01"
        method: PUT
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
          Content-Type: application/json
        body_format: json
        body:
          location: "{{ location }}"
          tags:
            created_by: aap
            environment: lab
        status_code: [200, 201]
      register: rg_result

    - name: Show result
      ansible.builtin.debug:
        msg:
          - "Resource Group: {{ rg_result.json.name }}"
          - "Location: {{ rg_result.json.location }}"
          - "Provisioning State: {{ rg_result.json.properties.provisioningState }}"
